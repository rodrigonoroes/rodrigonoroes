<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Rodrigo Norões Moura de Carvalho terminal résumé</title>
  <desc id="desc">Modern black and green animated terminal header containing résumé information.</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020503"/>
      <stop offset="0.55" stop-color="#050a07"/>
      <stop offset="1" stop-color="#020403"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0b3b21"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0b3b21"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22c55e" stroke-opacity=".035"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" opacity=".28"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .boot { opacity: 0; animation: appear .45s ease-out forwards; }
      .d1 { animation-delay: .25s; }
      .d2 { animation-delay: .75s; }
      .d3 { animation-delay: 1.2s; }
      .d4 { animation-delay: 1.65s; }
      .d5 { animation-delay: 2.1s; }
      .cursor { animation: blink 1s steps(1, end) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .scan { animation: scan 7s linear infinite; }
      @keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes scan { from { transform: translateY(-520px); } to { transform: translateY(520px); } }
      @media (prefers-reduced-motion: reduce) {
        .boot, .cursor, .pulse, .scan { animation: none !important; opacity: 1; transform: none; }
      }
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#000000"/>
  <rect x="12" y="12" width="1176" height="496" rx="18" fill="url(#screen)" stroke="#123d24" stroke-width="2"/>
  <rect x="13" y="13" width="1174" height="494" rx="17" fill="url(#grid)"/>
  <path d="M13 78H1187" stroke="url(#edge)" stroke-width="2"/>

  <circle cx="46" cy="46" r="6" fill="#14532d"/>
  <circle cx="70" cy="46" r="6" fill="#166534"/>
  <circle cx="94" cy="46" r="6" fill="#22c55e" class="pulse"/>
  <text x="122" y="53" class="mono" fill="#86efac" font-size="17">resume-terminal</text>
  <text x="1150" y="53" class="mono" fill="#4ade80" font-size="15" text-anchor="end">secure connection</text>

  <g class="mono">
    <text x="58" y="120" fill="#4ade80" font-size="18" class="boot d1">rodrigo.noroes@gmail.com:~$ ./profile --public</text>
    <text x="58" y="164" fill="#86efac" font-size="17" class="boot d2">initializing professional record...</text>
    <text x="58" y="198" fill="#86efac" font-size="17" class="boot d3">loading 20+ years of software development experience...</text>

    <text x="58" y="272" fill="#dcfce7" font-size="34" font-weight="700" class="boot d4" filter="url(#glow)">RODRIGO NORÕES MOURA DE CARVALHO</text>
    <text x="60" y="316" fill="#4ade80" font-size="21" class="boot d5">SENIOR JAVA DEVELOPER  /  SOFTWARE DEVELOPER</text>

    <rect x="58" y="356" width="1084" height="92" rx="10" fill="#020704" stroke="#14532d"/>
    <text x="84" y="390" fill="#22c55e" font-size="16" class="boot d5">JAVA</text>
    <text x="218" y="390" fill="#22c55e" font-size="16" class="boot d5">SPRING BOOT</text>
    <text x="414" y="390" fill="#22c55e" font-size="16" class="boot d5">ANGULAR</text>
    <text x="572" y="390" fill="#22c55e" font-size="16" class="boot d5">FHIR / HL7</text>
    <text x="770" y="390" fill="#22c55e" font-size="16" class="boot d5">CLOUD</text>
    <text x="900" y="390" fill="#22c55e" font-size="16" class="boot d5">MICROSERVICES</text>

    <text x="84" y="426" fill="#86efac" font-size="15" class="boot d5">healthcare · banking · telecom · government · education · retail</text>
    <text x="58" y="482" fill="#4ade80" font-size="17">$</text>
    <rect x="80" y="466" width="11" height="20" rx="1" fill="#4ade80" class="cursor"/>
  </g>

  <rect x="0" y="-8" width="1200" height="34" fill="#22c55e" opacity=".045" class="scan"/>
  <rect width="1200" height="520" rx="24" fill="url(#scanlines)" pointer-events="none"/>
</svg>
