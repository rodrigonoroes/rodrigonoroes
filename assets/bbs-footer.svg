<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title description">
  <title id="title">BBS end of transmission</title>
  <desc id="description">Colorful 1990s terminal footer with end of transmission message.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff2bd6"/><stop offset="0.5" stop-color="#00d9ff"/><stop offset="1" stop-color="#39ff14"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity="0.22"/></pattern>
  </defs>
  <rect width="1200" height="150" rx="14" fill="#02020a"/>
  <rect x="10" y="10" width="1180" height="130" rx="10" fill="#070619" stroke="url(#edge)" stroke-width="3"/>
  <text x="600" y="48" text-anchor="middle" fill="#ff2bd6" font-family="monospace" font-size="20">╔═══════════════ END OF TRANSMISSION ═══════════════╗</text>
  <text x="600" y="83" text-anchor="middle" fill="#00d9ff" font-family="monospace" font-size="18">NO CARRIER? NEVER. THE NEXT BUILD IS ALREADY CONNECTING.</text>
  <text x="600" y="116" text-anchor="middle" fill="#39ff14" font-family="monospace" font-size="17">STAY CURIOUS  ·  SHIP CAREFULLY  ·  KEEP BUILDING_</text>
  <rect width="1200" height="150" rx="14" fill="url(#scan)" pointer-events="none"/>
</svg>
