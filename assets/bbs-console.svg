<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">BBS technology channels</title>
  <desc id="description">A dark ANSI-style BBS console displaying backend, frontend, data, cloud and AI channels.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070619"/><stop offset="1" stop-color="#020b12"/>
    </linearGradient>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1200" height="390" rx="16" fill="#010106"/>
  <rect x="12" y="12" width="1176" height="366" rx="12" fill="url(#panel)" stroke="#8a7dff" stroke-width="2"/>
  <text x="42" y="50" fill="#ff2bd6" font-family="monospace" font-size="19">╔══ RCS NETWORK CHANNEL SCANNER ═══════════════════════════════════════════════════════╗</text>

  <g font-family="monospace" font-size="18">
    <text x="52" y="94" fill="#39ff14">#BACKEND</text><text x="215" y="94" fill="#d9ffd3">Java / Spring Boot / Security / REST / Microservices</text><text x="1110" y="94" fill="#39ff14">[ON]</text>
    <text x="52" y="132" fill="#00d9ff">#FRONTEND</text><text x="215" y="132" fill="#d2f8ff">Angular / TypeScript / RxJS / Signals / Accessible UI</text><text x="1110" y="132" fill="#00d9ff">[ON]</text>
    <text x="52" y="170" fill="#ffb000">#DATA</text><text x="215" y="170" fill="#fff0be">PostgreSQL / Oracle / DB2 / Flyway / Transactions</text><text x="1110" y="170" fill="#ffb000">[ON]</text>
    <text x="52" y="208" fill="#ff2bd6">#INTEGRATION</text><text x="215" y="208" fill="#ffd0f5">FHIR / HL7 / Kafka / RabbitMQ / JMS / CQRS</text><text x="1110" y="208" fill="#ff2bd6">[ON]</text>
    <text x="52" y="246" fill="#8a7dff">#CLOUD</text><text x="215" y="246" fill="#dedaff">AWS / Azure / GCP / Docker / Kubernetes / Observability</text><text x="1110" y="246" fill="#8a7dff">[ON]</text>
    <text x="52" y="284" fill="#ff5f56">#SECURITY</text><text x="215" y="284" fill="#ffd6d3">JWT / OAuth2 / OWASP / Rate Limiting / Audit</text><text x="1110" y="284" fill="#ff5f56">[ON]</text>
    <text x="52" y="322" fill="#00ff9c">#AI-LAB</text><text x="215" y="322" fill="#ceffeb">Spring AI / OpenAI / Bedrock / Agents / Automation</text><text x="1110" y="322" fill="#00ff9c">[ON]</text>
  </g>
  <text x="42" y="360" fill="#ff2bd6" font-family="monospace" font-size="19">╚══ 7 CHANNELS ACTIVE · NO CARRIER LOST · SYSTEM READY ════════════════════════════════╝</text>
  <rect width="1200" height="390" rx="16" fill="url(#lines)" pointer-events="none"/>
</svg>

