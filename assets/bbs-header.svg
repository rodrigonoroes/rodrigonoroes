<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Rodrigo Carvalho developer profile</title>
  <desc id="description">Retro BBS terminal banner for a Java, Spring Boot, Angular and AI full-stack developer.</desc>
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.16"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="18" fill="#030804"/>
  <rect x="16" y="16" width="1168" height="328" rx="12" fill="#071007" stroke="#39ff14" stroke-width="2"/>
  <rect x="30" y="30" width="1140" height="300" rx="8" fill="none" stroke="#176b12"/>
  <circle cx="54" cy="55" r="6" fill="#ff5f56"/>
  <circle cx="76" cy="55" r="6" fill="#ffbd2e"/>
  <circle cx="98" cy="55" r="6" fill="#27c93f"/>
  <text x="600" y="61" fill="#8da58d" font-family="monospace" font-size="16" text-anchor="middle">RODRIGO.DEV // SECURE TERMINAL</text>
  <line x1="31" y1="78" x2="1169" y2="78" stroke="#176b12"/>
  <text x="64" y="119" fill="#ffb000" font-family="monospace" font-size="18">CONNECT 2400/8/N/1 ... CARRIER DETECTED</text>
  <text x="64" y="174" fill="#39ff14" font-family="monospace" font-size="43" font-weight="700" filter="url(#glow)">RODRIGO CARVALHO</text>
  <text x="67" y="214" fill="#b8ffad" font-family="monospace" font-size="23">JAVA + SPRING BOOT + ANGULAR + AI FULL-STACK</text>
  <text x="67" y="259" fill="#6cdb63" font-family="monospace" font-size="18">[ BACKEND ] [ FRONTEND ] [ DATA ] [ CLOUD ] [ AI ]</text>
  <text x="67" y="304" fill="#ffb000" font-family="monospace" font-size="17">C:\PROFILE&gt; BUILDING RELIABLE SOFTWARE_</text>
  <rect width="1200" height="360" rx="18" fill="url(#scanlines)" pointer-events="none"/>
</svg>

