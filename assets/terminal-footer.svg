<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="title desc">
  <title id="title">Terminal connection footer</title>
  <desc id="desc">Animated green terminal footer with a blinking cursor.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .signal { animation: signal 2.2s ease-in-out infinite; }
      @keyframes blink { 0%,48% { opacity: 1; } 49%,100% { opacity: 0; } }
      @keyframes signal { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .cursor,.signal { animation: none !important; opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="130" rx="16" fill="#010302"/>
  <rect x="12" y="12" width="1176" height="106" rx="12" fill="#030805" stroke="#14532d"/>
  <circle cx="42" cy="40" r="5" fill="#22c55e" class="signal"/>
  <text x="60" y="46" class="mono" fill="#86efac" font-size="16">connection active</text>
  <text x="42" y="88" class="mono" fill="#4ade80" font-size="18">rodrigo@career:~$</text>
  <rect x="246" y="72" width="11" height="20" rx="1" fill="#4ade80" class="cursor"/>
  <text x="1154" y="88" class="mono" fill="#166534" font-size="14" text-anchor="end">EOF</text>
</svg>
