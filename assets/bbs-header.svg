<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Rodrigo Carvalho Systems BBS</title>
  <desc id="description">A colorful dark 1990s bulletin board system terminal introducing Rodrigo Carvalho, Java, Spring Boot, Angular and AI full-stack developer.</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02020a"/>
      <stop offset="0.55" stop-color="#070619"/>
      <stop offset="1" stop-color="#020b12"/>
    </linearGradient>
    <linearGradient id="ansi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="0.32" stop-color="#8a7dff"/>
      <stop offset="0.64" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#39ff14"/>
    </linearGradient>
    <pattern id="scanlines" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="2" fill="#000" opacity="0.22"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00d9ff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="22" fill="#010106"/>
  <rect x="12" y="12" width="1176" height="596" rx="18" fill="url(#screen)" stroke="#ff2bd6" stroke-width="3"/>
  <rect x="22" y="22" width="1156" height="576" rx="13" fill="url(#grid)" stroke="#00d9ff" stroke-width="1"/>

  <path d="M23 82H1177" stroke="url(#ansi)" stroke-width="3"/>
  <circle cx="50" cy="52" r="8" fill="#ff3b30" filter="url(#pinkGlow)"/>
  <circle cx="78" cy="52" r="8" fill="#ffb000"/>
  <circle cx="106" cy="52" r="8" fill="#39ff14"/>
