<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Rodrigo Norões Moura de Carvalho résumé terminal</title>
  <desc id="description">A monochrome retro terminal showing the résumé of Rodrigo Norões Moura de Carvalho.</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020202"/>
      <stop offset="0.55" stop-color="#090909"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <linearGradient id="ansi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#777777"/>
      <stop offset="0.32" stop-color="#a0a0a0"/>
      <stop offset="0.64" stop-color="#d0d0d0"/>
      <stop offset="1" stop-color="#f2f2f2"/>
    </linearGradient>
    <pattern id="scanlines" width="5" height="5" patternUnits="userSpaceOnUse">
