    <text x="600" y="256" text-anchor="middle">██╔══██╗██║   ██║██║  ██║██╔══██╗██║██║   ██║██║   ██║</text>
    <text x="600" y="285" text-anchor="middle">██║  ██║╚██████╔╝██████╔╝██║  ██║██║╚██████╔╝╚██████╔╝</text>
