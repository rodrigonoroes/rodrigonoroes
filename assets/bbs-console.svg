<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">Résumé technical skills terminal</title>
  <desc id="description">A monochrome retro terminal displaying backend, frontend, data, cloud and AI skills.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090909"/><stop offset="1" stop-color="#020202"/>
    </linearGradient>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1200" height="390" rx="16" fill="#010101"/>
  <rect x="12" y="12" width="1176" height="366" rx="12" fill="url(#panel)" stroke="#888888" stroke-width="2"/>
  <text x="42" y="50" fill="#dedede" font-family="monospace" font-size="19">╔══ RESUME TECHNICAL CHANNEL SCANNER ══════════════════════════════════════════════════╗</text>

  <g font-family="monospace" font-size="18">
    <text x="52" y="94" fill="#f0f0f0">#BACKEND</text><text x="215" y="94" fill="#d8d8d8">Java / Spring Boot / Security / REST / Microservices</text><text x="1110" y="94" fill="#f0f0f0">[ON]</text>
    <text x="52" y="132" fill="#dddddd">#FRONTEND</text><text x="215" y="132" fill="#cccccc">Angular / TypeScript / RxJS / Signals / Accessible UI</text><text x="1110" y="132" fill="#dddddd">[ON]</text>
    <text x="52" y="170" fill="#c8c8c8">#DATA</text><text x="215" y="170" fill="#bbbbbb">PostgreSQL / Oracle / DB2 / Flyway / Transactions</text><text x="1110" y="170" fill="#c8c8c8">[ON]</text>
    <text x="52" y="208" fill="#b8b8b8">#INTEGRATION</text><text x="215" y="208" fill="#aaaaaa">FHIR / HL7 / Kafka / RabbitMQ / JMS / CQRS</text><text x="1110" y="208" fill="#b8b8b8">[ON]</text>
    <text x="52" y="246" fill="#aaaaaa">#CLOUD</text><text x="215" y="246" fill="#999999">AWS / Azure / GCP / Docker / Kubernetes / Observability</text><text x="1110" y="246" fill="#aaaaaa">[ON]</text>
    <text x="52" y="284" fill="#cccccc">#SECURITY</text><text x="215" y="284" fill="#bcbcbc">JWT / OAuth2 / OWASP / Rate Limiting / Audit</text><text x="1110" y="284" fill="#cccccc">[ON]</text>
    <text x="52" y="322" fill="#eeeeee">#AI-LAB</text><text x="215" y="322" fill="#d4d4d4">Spring AI / OpenAI / Bedrock / Agents / Automation</text><text x="1110" y="322" fill="#eeeeee">[ON]</text>
  </g>
  <text x="42" y="360" fill="#dedede" font-family="monospace" font-size="19">╚══ 7 CHANNELS ACTIVE · NO CARRIER LOST · SYSTEM READY ════════════════════════════════╝</text>
  <rect width="1200" height="390" rx="16" fill="url(#lines)" pointer-events="none"/>
</svg>
